<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --success: #16a34a;
      --danger: #dc2626;
      --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    h3 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 9999px;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .status-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border-strong);
    }
    .dot.online {
      background: var(--success);
      box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.15);
    }
    .dot.offline {
      background: var(--danger);
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.15);
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: all 0.15s;
      margin-bottom: 8px;
      text-align: center;
      display: block;
      text-decoration: none;
    }
    .btn:hover {
      background: #f1f5f9;
      border-color: var(--border-strong);
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    .info-text {
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.4;
      text-align: center;
      margin-top: 10px;
    }
    kbd {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 11px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>Markup Bridge</h3>
    <span class="badge" style="background:#eff6ff;color:#2563eb;border-color:#bfdbfe;font-weight:700;">v2.1.3</span>
  </div>

  <div class="status-card">
    <div class="status-indicator">
      <div class="dot" id="dot"></div>
      <span id="status-label">Checking...</span>
    </div>
    <span id="status-port" style="font-size: 11px; color: var(--text-muted);">127.0.0.1:3005</span>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 4px;">
    <span style="font-weight: 600; font-size: 12px;">Extension Enabled</span>
    <label class="switch" style="position: relative; display: inline-block; width: 34px; height: 20px;">
      <input type="checkbox" id="chk-master-enable" style="opacity: 0; width: 0; height: 0;" checked>
      <span class="slider" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .2s; border-radius: 34px;"></span>
      <style>
        input:checked + .slider { background-color: #16a34a; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
        input:checked + .slider:before { transform: translateX(14px); }
      </style>
    </label>
  </div>

  <button class="btn btn-primary" id="btn-activate">
    Toggle Inspector on Active Tab
  </button>

  <button class="btn" id="btn-setup">
    <span>Workspace Setup & Configuration</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: auto;">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
      <polyline points="15 3 21 3 21 9"></polyline>
      <line x1="10" y1="14" x2="21" y2="3"></line>
    </svg>
  </button>

  <div class="info-text">
    Active on all tabs. Press <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>X</kbd> to inspect or draw.
  </div>

  <script src="popup.js"></script>
</body>
</html>
